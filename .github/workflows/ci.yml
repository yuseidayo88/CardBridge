name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build web
        run: pnpm --filter @cardbridge/web build

      # Applies every migration to a real Postgres and asserts that the
      # integrity constraints reject bad data. A CHECK constraint dropped by a
      # careless schema edit looks identical to one that works until production
      # data proves otherwise.
      - name: Verify migrations and constraints
        run: |
          sudo systemctl start postgresql || true
          sudo -u postgres /usr/lib/postgresql/*/bin/pg_ctl status || true
          sudo bash scripts/db/verify-migrations.sh
